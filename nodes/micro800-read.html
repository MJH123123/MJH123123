<script type="text/javascript">
  RED.nodes.registerType('micro800-read', {
    category: 'Micro800',
    color: '#7ab3ef',
    defaults: {
      name: { value: '' },
      plc: { type: 'micro800-config', required: true },
      mode: { value: 'single' },
      varName: { value: '', validate: function (v) { return this.mode === 'all' || !!v; } },
      interval: { value: 0, validate: RED.validators.number() },
      onchange: { value: false }
    },
    inputs: 1,
    outputs: 1,
    icon: 'bridge.svg',
    label: function () {
      if (this.name) return this.name;
      if (this.mode === 'all') return 'read all variables';
      if (this.varName) return 'read ' + this.varName;
      return 'micro800 read';
    },
    labelStyle: function () { return this.name ? 'node_label_italic' : ''; },
    oneditprepare: function () {
      var node = this;
      function fillVars() {
        var cfg = RED.nodes.node($('#node-input-plc').val());
        var sel = $('#node-input-varName').empty();
        var vars = (cfg && cfg.vars) || [];
        vars.forEach(function (v) {
          sel.append($('<option/>').val(v.name).text(v.name + '   (' + v.tag + ')'));
        });
        if (!vars.length) sel.append($('<option/>').val('').text('- no variables defined on PLC config -'));
        if (node.varName) sel.val(node.varName);
      }
      function toggle() {
        $('.m800-row-single').toggle($('#node-input-mode').val() === 'single');
      }
      $('#node-input-mode').val(node.mode === 'all' ? 'all' : 'single').on('change', toggle);
      $('#node-input-plc').on('change', fillVars);
      fillVars();
      toggle();
    },
    oneditsave: function () {
      this.varName = $('#node-input-varName').val() || '';
    }
  });
</script>

<script type="text/html" data-template-name="micro800-read">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>
  <div class="form-row">
    <label for="node-input-plc"><i class="fa fa-microchip"></i> PLC</label>
    <input type="text" id="node-input-plc">
  </div>
  <div class="form-row">
    <label for="node-input-mode"><i class="fa fa-crosshairs"></i> Read</label>
    <select id="node-input-mode" style="width:70%">
      <option value="single">Single variable</option>
      <option value="all">All variables</option>
    </select>
  </div>
  <div class="form-row m800-row-single">
    <label for="node-input-varName"><i class="fa fa-list"></i> Variable</label>
    <select id="node-input-varName" style="width:70%"></select>
  </div>
  <div class="form-row">
    <label for="node-input-interval"><i class="fa fa-clock-o"></i> Poll (ms)</label>
    <input type="text" id="node-input-interval" style="width:100px">
    <span style="margin-left:6px">0 = only when a message arrives</span>
  </div>
  <div class="form-row">
    <label>&nbsp;</label>
    <input type="checkbox" id="node-input-onchange" style="display:inline-block;width:auto;vertical-align:top">
    <label for="node-input-onchange" style="width:auto"> Polling: only send when value changes</label>
  </div>
  <div class="form-tips">Tags are defined on the PLC config node's <b>Variables</b> tab.</div>
</script>

<script type="text/html" data-help-name="micro800-read">
  <p>Reads variables from a Micro800 PLC. Variables (name, tag, type, elements) are defined on the
  PLC config node's <b>Variables</b> tab.</p>
  <ul>
    <li><b>Single variable</b>: outputs the value (an array if Elements &gt; 1).</li>
    <li><b>All variables</b>: reads every entry; outputs an object <code>{name: value}</code>.</li>
  </ul>
  <h3>Input (optional)</h3>
  <dl class="message-properties">
    <dt class="optional">variable <span class="property-type">string | array</span></dt>
    <dd>Name(s) of variable(s) to read instead of the configured selection.</dd>
  </dl>
  <h3>Output</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">any | object</span></dt>
    <dd>The value, or <code>{name: value}</code> for several variables.</dd>
    <dt>topic <span class="property-type">string</span></dt>
    <dd>Variable name (<code>all</code> in All mode).</dd>
    <dt>dataType <span class="property-type">string | object</span></dt>
    <dd>BOOL, SINT, INT, DINT, LINT, USINT, UINT, UDINT, ULINT, REAL, LREAL, STRING, SSTRING.</dd>
  </dl>
  <p>In CCW the variable must be <b>global</b> with <i>External access</i> set to Read or Read/Write.</p>
</script>
